name: Full Debug timing (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  timing:
    name: Full Debug / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the measured source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 29ddaf23fb883b56d6d840118f5034b2a3931952
          persist-credentials: false

      - name: Set up timing interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Configure Debug
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRECTANGLE_BIN_PACK_BUILD_TESTS=ON

      - name: Build the existing test
        run: cmake --build build --config Debug --target MaxRectsBinPackTest --parallel 2

      - name: Time the full Debug test without --quick
        timeout-minutes: 90
        shell: python {0}
        run: |
          import datetime
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          executable = Path("build/Debug/MaxRectsBinPackTest.exe" if os.name == "nt"
                            else "build/MaxRectsBinPackTest").resolve()
          print("BENCHMARK_START_UTC=" + datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          start = time.perf_counter()
          process = subprocess.Popen([str(executable)], stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT, text=True)
          while True:
              try:
                  output, _ = process.communicate(timeout=60)
                  break
              except subprocess.TimeoutExpired:
                  print(f"STILL_RUNNING_SECONDS={time.perf_counter() - start:.3f}", flush=True)
          elapsed = time.perf_counter() - start
          print(output, end="" if output.endswith("\n") else "\n", flush=True)
          result = {"platform": os.environ["RUNNER_OS"],
                    "wall_seconds": round(elapsed, 3), "exit_code": process.returncode}
          print("TIMING_RESULT=" + json.dumps(result), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Full Debug test: **{elapsed:.3f} seconds**, exit code {process.returncode}.\n\n")
              summary.write("Wall time includes packing and correctness checks, but not configure/build.\n")
          sys.exit(process.returncode)
